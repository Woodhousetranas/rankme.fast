# Generated by ops/coolify/render.ps1. Use Coolify Raw Compose mode.
name: ${COOLIFY_RESOURCE_UUID:?The Coolify application identity is required}
networks:
  core:
    driver: bridge
  rankme:
    external: true
    name: ${COOLIFY_RESOURCE_UUID:?The Coolify application identity is required}
