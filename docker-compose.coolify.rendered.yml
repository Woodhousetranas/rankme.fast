    expose:
      - "8080"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+ (process.env.PORT || 8080) +'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      timeout: 5s
    init: true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COOLIFY_RESOURCE_UUID}
      - traefik.http.routers.${COOLIFY_RESOURCE_UUID}-api.rule=Host(`${RANKME_HOST:-rankme.localhost}`)
        && PathPrefix(`/api`)
      - traefik.http.routers.${COOLIFY_RESOURCE_UUID}-api.entrypoints=http
      - traefik.http.routers.${COOLIFY_RESOURCE_UUID}-api.priority=100
      - traefik.http.routers.${COOLIFY_RESOURCE_UUID}-api.service=${COOLIFY_RESOURCE_UUID}-api
      - traefik.http.services.${COOLIFY_RESOURCE_UUID}-api.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 768m
    networks:
      core: null
      rankme: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s
    tmpfs:
      - /tmp
  mongo:
    cpus: 0.5
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 20s
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      timeout: 5s
    image: mongo:7
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 512m
    networks:
      core: null
    pids_limit: 256
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - source: mongo-data
        target: /data/db
        type: volume
        volume: {}
  postgres:
    cpus: 0.5
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rankme}
      - POSTGRES_PASSWORD
      - POSTGRES_USER=${POSTGRES_USER:-rankme}
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-rankme} -d $${POSTGRES_DB:-rankme}
      timeout: 5s
    image: postgres:17-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 512m
    networks:
      core: null
    pids_limit: 256
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - source: postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  redis:
    command:
      - redis-server
      - --appendonly
      - 'yes'
    cpus: 0.25
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 5s
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
    image: redis:7-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 256m
    networks:
      core: null
    pids_limit: 128
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - source: redis-data
        target: /data
        type: volume
        volume: {}
  web:
    build:
      args:
        - APP_BUILD_SHA=${APP_BUILD_SHA:?An exact reviewed commit is required}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_APP_URL=${APP_URL:-}
        - VITE_GA_ID=${VITE_GA_ID:-}
        - VITE_GITHUB_URL=${VITE_GITHUB_URL:-}
        - VITE_RELEASE_STAGE=${VITE_RELEASE_STAGE:-beta}
        - VITE_SITE_URL=${VITE_SITE_URL}
        - APP_SOURCE_REVISION=${APP_SOURCE_REVISION:?The full reviewed commit is required}
      context: ./client
      dockerfile: Dockerfile
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      API_INTERNAL_URL: http://api:8080
      APP_URL: ${APP_URL:-}
      CLIENT_URL: ${CLIENT_URL}
      NODE_ENV: ${NODE_ENV:-production}
      PROXY_STREAM_TIMEOUT_MS: ${PROXY_STREAM_TIMEOUT_MS:-300000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
      WEB_PORT: 3000
    expose:
      - "3000"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      timeout: 5s
    init: true
    labels:
      - traefik.enable=true
